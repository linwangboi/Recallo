[flake8]
max-line-length = 79
exclude =
    */migrations/*,
    __pycache__,
    venv,
    env,
    .venv,
    .git,
    build,
    dist,
    settings.py,


[tool:black]
line-length = 79

# setup.cfg
[coverage:run]
omit =
    */migrations/*
    */venv/*
    manage.py
    */tests/*
    */__init__.py
    settings.py
    

[coverage:report]
show_missing = true
skip_covered = true
precision = 2

[coverage:html]
directory = coverage_html_report

[coverage]
branch = True
